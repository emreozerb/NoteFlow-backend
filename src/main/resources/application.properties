# JWT Configuration
jwt.secret-key=noteflow-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security
jwt.token.issuer=noteflow
jwt.token.lifetime=24h

# CORS Configuration
cors.allowed-origins=http://localhost:8080,http://10.0.2.2:8080

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/noteflowdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
file.upload.base-dir=./noteflow-uploads
file.upload.images-dir=${file.upload.base-dir}/images
file.upload.allowed-image-types=image/jpeg,image/png,image/jpg,image/webp

# Logging Configuration
logging.level.com.noteflow.noteflow_backend.security=DEBUG
logging.level.com.noteflow.noteflow_backend.controller=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE